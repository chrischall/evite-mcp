version: 1
name: Evite
slug: evite
summary: >-
  Evite tools for Claude — list events, view guest lists & RSVPs, RSVP, message
  guests, and create/edit events.
#
# Hosting note (deliberately a comment, not part of the user-facing summary):
# this is a BROWSER-BRIDGE MCP — it reaches evite.com through the user's
# signed-in tab via the fetchproxy bridge. A bridged registration also needs
# runtime `fly-shared`, `bridge: true` and a `bridgePortEnv`, which are
# registration fields this manifest has no schema for (set them over the
# control API). `state.dataDir` below is required for `bridge`.
env:
  - name: EVITE_EMAIL
    required: false
    help: >-
      Your Evite login email address. Optional — if omitted, the server falls
      back to a raw session cookie or the fetchproxy browser bridge (requires
      being signed in to evite.com).
  - name: EVITE_PASSWORD
    secret: true
    required: false
    help: >-
      Your Evite password. Optional — see EVITE_EMAIL.
  - name: EVITE_SESSION_COOKIE
    secret: true
    required: false
    help: >-
      A raw `cookie:` header copied from a signed-in evite.com tab (alternative
      to email/password). Used verbatim. Optional.
  - name: EVITE_DISABLE_FETCHPROXY
    required: false
    help: >-
      Set to 1 to disable the browser-bridge fallback, making missing
      credentials a hard error. Recommended for a hosted registration, which has
      no browser to fall back to.
  - name: EVITE_SESSION_CACHE
    required: false
    help: >-
      Set to false to disable the on-disk session cache and resolve a new
      session on every process start. Defaults to enabled.
  - name: EVITE_SESSION_FILE
    required: false
    help: >-
      Absolute path for the session cache file. Defaults to
      $MCP_DATA_DIR/.evite-mcp/session.json.
state:
  dataDir: true
  reason: >-
    Two things live here. The fetchproxy identity is at
    $HOME/.fetchproxy/identity/<name>.json and the pair code derives from it —
    without a persistent $HOME every cold start mints a fresh identity and
    re-prompts pairing in the browser, and the API refuses bridge without it.
    The resolved session is also cached at
    $MCP_DATA_DIR/.evite-mcp/session.json (0600), which matters most on that
    same tier: with the cache a cold start proceeds with no browser present at
    all. A raw EVITE_SESSION_COOKIE caches nothing.
egress:
  # Only hosts the SERVER PROCESS dials. Every mode — email/password login
  # (auth-login.ts), a raw EVITE_SESSION_COOKIE, and the fetchproxy bootstrap —
  # ends the same way: the bridge only LIFTS cookies from the signed-in tab
  # (auth.ts, `bootstrap()`), and every Evite call then goes out over plain
  # Node `fetch()` from this process. The bootstrap itself binds/joins a
  # loopback port and dials nothing outside.
  allow:
    # The Evite site and its internal API (client.ts BASE_URL, auth-login.ts
    # ORIGIN). Only the www host is ever dialled — the apex is not in any URL
    # this process builds, and it only ever 301s TO www.
    - www.evite.com
    # Firebase auth: signInWithCustomToken, called directly in client.ts.
    - identitytoolkit.googleapis.com
    # Photo upload POSTs to a Google Cloud Storage signed URL that the Evite
    # API hands back as `upload_url` — a RUNTIME host, so it appears nowhere
    # as a literal in this repo. Live captures show the path-style form
    # (`https://storage.googleapis.com/<bucket>`, docs/EVITE-API.md); the 303
    # it answers with is not followed (`redirect: 'manual'`).
    - storage.googleapis.com
    # Per-guest messaging reads/writes the Firebase Realtime Database at
    # `fire_config.databaseURL`, also supplied at runtime. RTDB instances are
    # `<project>.firebaseio.com` or `<name>.<region>.firebasedatabase.app` —
    # never the apex, and matching is exact, so both wildcards are needed.
    - '*.firebaseio.com'
    - '*.firebasedatabase.app'
